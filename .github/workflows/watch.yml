name: watch

on:
  push:
    branches: [master]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Run one check cycle
        run: python main.py
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_QQ_OPTION: ${{ secrets.PUSHPLUS_QQ_OPTION }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Persist dedupe state
        if: always()
        run: |
          git config user.name  "tibo-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ ! -f watcher_state.json ]; then exit 0; fi
          git add -f watcher_state.json
          if git diff --cached --quiet; then
            echo "state unchanged, nothing to commit"
          else
            git commit -m "state: record seen posts [skip ci]"
            git push
          fi
